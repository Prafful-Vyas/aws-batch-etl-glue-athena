name: destroy

# Tear down the whole infra/ stack (including all data in the bucket).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to confirm. This deletes all raw/processed data.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_bucket_name: ${{ vars.DATA_BUCKET_NAME }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_pipeline_schedule: ${{ vars.PIPELINE_SCHEDULE }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: ./.github/actions/terraform-init
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          region: ${{ vars.AWS_REGION }}
      - run: terraform destroy -input=false -auto-approve -lock-timeout=5m
        working-directory: infra
