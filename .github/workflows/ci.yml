name: ci

# Also called by deploy.yml, so nothing is deployed without passing these checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # In a workflow_call, github.workflow is the caller's name ("deploy"), so the
  # deploy's CI run and the standalone CI run never cancel each other.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.11.4"

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # Glue 4.0 runtime
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-java@v4 # PySpark needs a JDK
        with:
          distribution: temurin
          java-version: "11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v -rs

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [infra, bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits downloading the AWS ruleset
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  terraform-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov==3.2.255
      # Accepted findings are listed with reasons in .checkov.yaml.
      - run: checkov --config-file .checkov.yaml
